<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML to Penpot</title>
<style>
/* ── Theme */
[data-theme="dark"] {
  --bg:#0e0e12;--bg2:#15151c;--bg3:#1c1c26;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);
  --t1:#e8e8f0;--t2:#9090a8;--t3:#50505e;
  --inp:#1c1c26;--inp-b:rgba(255,255,255,.12);
  --accent:#5b6af5;
}
[data-theme="light"] {
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#ebebef;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.18);
  --t1:#111118;--t2:#555568;--t3:#aaaabc;
  --inp:#fff;--inp-b:rgba(0,0,0,.14);
  --accent:#5b6af5;
}
@media(prefers-color-scheme:dark){[data-theme="system"]{--bg:#0e0e12;--bg2:#15151c;--bg3:#1c1c26;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--t1:#e8e8f0;--t2:#9090a8;--t3:#50505e;--inp:#1c1c26;--inp-b:rgba(255,255,255,.12);--accent:#5b6af5;}}
@media(prefers-color-scheme:light){[data-theme="system"]{--bg:#f5f5f7;--bg2:#ffffff;--bg3:#ebebef;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.18);--t1:#111118;--t2:#555568;--t3:#aaaabc;--inp:#fff;--inp-b:rgba(0,0,0,.14);--accent:#5b6af5;}}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(91,106,245,.5)}
.hdr-title{font-size:14px;font-weight:600}
.hdr-sub{font-size:11px;color:var(--t3);margin-left:auto}

/* ── Tabs */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0}
.tab{font-size:13px;font-weight:500;padding:8px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);cursor:pointer}
.tab.on{color:var(--t1);border-bottom-color:var(--accent)}

/* ── Body */
.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}

/* ── Section */
.sec-label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.sec-label span{font-size:11px;color:var(--t3);text-transform:none;letter-spacing:0;font-weight:400}

/* ── Textarea */
textarea.code-in{
  font-family:'Consolas','Fira Code',monospace;
  font-size:12px;
  line-height:1.5;
  width:100%;
  padding:10px;
  background:var(--inp);
  border:1px solid var(--inp-b);
  border-radius:6px;
  color:var(--t1);
  outline:none;
  resize:vertical;
}
textarea.code-in:focus{border-color:var(--accent)}
textarea.code-in::placeholder{color:var(--t3)}

/* ── Options */
.opt-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
.opt-row input[type=number]{
  width:64px;font-family:monospace;font-size:13px;
  padding:4px 6px;background:var(--inp);border:1px solid var(--inp-b);
  border-radius:4px;color:var(--t1);outline:none;
}
.opt-row input[type=number]:focus{border-color:var(--accent)}
.check-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--line2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-box.on{background:var(--accent);border-color:var(--accent)}
.check-box.on::after{content:'✓';font-size:10px;color:#fff;line-height:1}

/* ── Stats bar */
.stats{font-size:12px;color:var(--t3);padding:6px 10px;background:var(--bg3);border:1px solid var(--line);border-radius:5px;display:none}
.stats.show{display:block}

/* ── Log */
.log{font-family:monospace;font-size:11px;color:var(--t2);padding:8px 10px;background:var(--bg3);border:1px solid var(--line);border-radius:5px;max-height:80px;overflow-y:auto;display:none;white-space:pre-wrap}
.log.show{display:block}

/* ── Footer */
.ftr{padding:12px 14px;border-top:1px solid var(--line);background:var(--bg2);flex-shrink:0;display:flex;gap:8px}
.btn{font-size:13px;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--line2);background:var(--bg3);color:var(--t2);cursor:pointer;flex:1}
.btn:hover{color:var(--t1)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{opacity:.9}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ── Toast */
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#22d4a0;color:#041a10;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}

/* ── Hidden renderer iframe */
#renderer{position:absolute;left:-9999px;top:-9999px;width:1440px;height:900px;border:none;visibility:hidden}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
</style>
</head>
<body data-theme="system">

<div class="hdr">
  <div class="hdr-dot"></div>
  <span class="hdr-title">HTML to Penpot</span>
  <span class="hdr-sub">paste → frames</span>
</div>

<!-- Tabs: HTML / CSS / Options -->
<div class="tabs">
  <button class="tab on" onclick="switchTab('html',this)">HTML</button>
  <button class="tab"    onclick="switchTab('css',this)">CSS</button>
  <button class="tab"    onclick="switchTab('opts',this)">Options</button>
</div>

<div class="body" id="body">

  <!-- ── HTML tab -->
  <div id="tab-html">
    <div class="sec-label">
      HTML code
      <span>paste full file or snippet</span>
    </div>
    <textarea class="code-in" id="htmlIn" rows="18"
      placeholder="Paste your HTML here...

You can paste:
• A full HTML file (with &lt;style&gt; inside)
• Just the &lt;body&gt; content
• Any HTML snippet

If your CSS is in a separate file, switch to the CSS tab and paste it there."></textarea>
    <div style="margin-top:6px;display:flex;gap:6px">
        <button class="btn" onclick="loadSample()" style="flex:0 0 auto;font-size:12px;padding:5px 10px">Load sample</button>
        <label class="btn" style="flex:0 0 auto;font-size:12px;padding:5px 10px;cursor:pointer">
        Upload HTML
        <input type="file" accept=".html,.htm" onchange="loadFile(event)" style="display:none">
        </label>
        <label class="btn" style="flex:0 0 auto;font-size:12px;padding:5px 10px;cursor:pointer">
        Upload CSS
        <input type="file" accept=".css" onchange="loadCssFile(event)" style="display:none">
        </label>
        <button class="btn" onclick="clearAll()" style="flex:0 0 auto;font-size:12px;padding:5px 10px">Clear</button>
    </div>

  <!-- ── CSS tab -->
  <div id="tab-css" style="display:none">
    <div class="sec-label">
      External CSS
      <span>optional — if separate from HTML</span>
    </div>
    <textarea class="code-in" id="cssIn" rows="18"
      placeholder="Paste your CSS here (optional)...

This CSS will be injected into the HTML before rendering.
If your HTML already has &lt;style&gt; tags inside, you don't need this tab."></textarea>
  </div>

  <!-- ── Options tab -->
  <div id="tab-opts" style="display:none">
    <div class="sec-label" style="margin-bottom:10px">Rendering</div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="opt-row">
        <span style="flex:1">Viewport width (px)</span>
        <input type="number" id="optWidth" value="1440" min="320" max="3840">
      </div>
      <div class="opt-row">
        <span style="flex:1">Viewport height (px)</span>
        <input type="number" id="optHeight" value="900" min="200" max="2160">
      </div>
      <div class="opt-row">
        <div class="check-box on" id="chkText" onclick="toggleCheck(this)"></div>
        <span>Include text layers</span>
      </div>
      <div class="opt-row">
        <div class="check-box on" id="chkBg" onclick="toggleCheck(this)"></div>
        <span>Include background colors</span>
      </div>
      <div class="opt-row">
        <div class="check-box on" id="chkBorder" onclick="toggleCheck(this)"></div>
        <span>Include borders</span>
      </div>
      <div class="opt-row">
        <div class="check-box" id="chkHidden" onclick="toggleCheck(this)"></div>
        <span>Include hidden elements</span>
      </div>
      <div class="opt-row">
        <span style="flex:1">Min element size (px)</span>
        <input type="number" id="optMinSize" value="4" min="1" max="20">
      </div>
      <div class="opt-row">
        <span style="flex:1">Max depth (layers)</span>
        <input type="number" id="optMaxDepth" value="8" min="2" max="30">
      </div>
    </div>
  </div>

  <!-- Stats + log (shown after parse) -->
  <div class="stats" id="stats"></div>
  <div class="log"   id="log"></div>

</div>

<div class="ftr">
  <button class="btn" onclick="previewParse()">Preview</button>
  <button class="btn pri" id="genBtn" onclick="generate()">Generate in Penpot</button>
</div>

<div class="toast" id="toast"></div>

<!-- Hidden iframe where we render the HTML to measure elements -->
<iframe id="renderer" sandbox="allow-same-origin allow-scripts"></iframe>

<!-- All logic lives in parser.js -->
<script src="parser.js"></script>

</body>
</html>
